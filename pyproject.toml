[project]
name = "llm-verbal-skills-trainer"
version = "0.1.0"
description = "LLM model which helps candidate to enhance their verbal skills"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gradio (>=5.20.0,<6.0.0)",
    "transformers (>=4.49.0,<5.0.0)",
    "cachetools (>=5.5.2,<6.0.0)",
    "llvmlite (>=0.44.0,<0.45.0)",
    "numba (>=0.61.0,<0.62.0)",
    "openai-whisper (>=20240930,<20240931)",
    "protobuf (>=5.29.3,<6.0.0)",
    "tiktoken (>=0.9.0,<0.10.0)",
    "sentencepiece (>=0.2.0,<0.3.0)",
    "accelerate (>=1.4.0,<2.0.0)",
    "ollama (>=0.4.7,<0.5.0)",
    "pyaudio (>=0.2.14,<0.3.0)",
    "pydub (>=0.25.1,<0.26.0)",
    "noisereduce (>=3.0.3,<4.0.0)",
    "soundfile (>=0.13.1,<0.14.0)",
    "plotly (>=6.0.0,<7.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "rich (>=13.9.4,<14.0.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "pyyaml (>=6.0.1,<7.0.0)",
    "python-json-logger (>=2.0.7,<3.0.0)",
    "psutil (>=5.9.0,<8.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest (>=7.4.0,<8.0.0)",
    "pytest-cov (>=4.1.0,<5.0.0)",
    "mypy (>=1.7.0,<2.0.0)",
    "ruff (>=0.1.0,<0.2.0)",
    "black (>=23.11.0,<24.0.0)",
    "pre-commit (>=3.5.0,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]



