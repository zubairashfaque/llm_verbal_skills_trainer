version: '3.8'

services:
  # Ollama LLM service
  ollama:
    image: ollama/ollama:latest
    container_name: llm-trainer-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-trainer-app
    ports:
      - "7860:7860"
    environment:
      - MODEL_NAME=llama3.2:latest
      - OLLAMA_SERVER_URL=http://ollama:11434/api/
      - LOG_LEVEL=INFO
      - WHISPER_MODEL=base
      - USE_4BIT=true
      - CACHE_SIZE=64
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - app_cache:/app/.cache
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Model downloader (runs once to pull models)
  model-downloader:
    image: ollama/ollama:latest
    container_name: llm-trainer-model-downloader
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command:
      - -c
      - |
        ollama pull llama3.2:latest
        echo "Model download complete"
    restart: "no"

volumes:
  ollama_data:
    driver: local
  app_cache:
    driver: local

networks:
  default:
    name: llm-trainer-network
